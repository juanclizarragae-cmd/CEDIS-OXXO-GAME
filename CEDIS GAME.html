<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#f6d9b8; --far:#e9a98a; --near:#c97b84; --ground:#4a2f4f; --ink:#2a1a33;
  --hero:#2a1a33; --hero-eye:#f6d9b8; --spike:#7a2e4d; --bg:#fbefe0; --muted:#7b6070; --btn:#4a2f4f; --btn-ink:#fbefe0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#2b2147; --far:#47306a; --near:#6b3f7c; --ground:#150f26; --ink:#f3e3d0;
    --hero:#f6c177; --hero-eye:#150f26; --spike:#ff8f8f; --bg:#120c20; --muted:#a898b8; --btn:#f6c177; --btn-ink:#150f26;
  }
}
:root[data-theme="dark"]{
  --sky:#2b2147; --far:#47306a; --near:#6b3f7c; --ground:#150f26; --ink:#f3e3d0;
  --hero:#f6c177; --hero-eye:#150f26; --spike:#ff8f8f; --bg:#120c20; --muted:#a898b8; --btn:#f6c177; --btn-ink:#150f26;
}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;padding:16px}
main{width:100%;max-width:760px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.score{font-size:1rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-size:1.3rem}
.stage{position:relative;border-radius:14px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.overlay[hidden]{display:none}
.overlay h2{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.02em}
.overlay p{margin:0;color:var(--muted);max-width:32ch}
button{font:inherit;font-weight:800;background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hint{margin:10px 2px 0;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <header>
    <h1>Salta</h1>
    <div class="score">Puntos <b id="score">0</b> · Récord <b id="best">0</b></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" width="720" height="300" aria-label="Juego: salta los obstáculos"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">Esquiva los montacargas</h2>
      <p id="msg">Toca la pantalla o pulsa Espacio para saltar. Puedes saltar dos veces en el aire.</p>
      <button id="go">Empezar</button>
    </div>
  </div>
  <p class="hint">Espacio o ↑ para saltar · en el celular, toca la pantalla</p>
</main>

  var best=0;
  try{ best=parseInt(localStorage.getItem('salta-best')||'0',10)||0; }catch(e){}
  bestEl.textContent=best;

  var PW=40, PH=49, state='idle', p, obs, speed, dist, nextGap, frame, raf;
  function reset(){
    p={x:80,y:GY-PH,w:PW,h:PH,vy:0,jumps:0};
    obs=[]; speed=5; dist=0; nextGap=60; frame=0;
  }
  reset();

  function jump(){
    if(state!=='running') return;
    if(p.jumps<2){ p.vy=-12.2; p.jumps++; }
  }
  function start(){
    reset(); state='running'; overlay.hidden=true; scoreEl.textContent='0';
    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  }
  function end(){
    state='over';
    var pts=Math.floor(dist/10);
    if(pts>best){ best=pts; bestEl.textContent=best; try{localStorage.setItem('salta-best',String(best));}catch(e){} }
    titleEl.textContent='Chocaste: '+pts+' puntos';
    msgEl.textContent=pts>=best&&pts>0?'¡Nuevo récord!':'Inténtalo otra vez.';
    goBtn.textContent='Jugar de nuevo';
    overlay.hidden=false; goBtn.focus();
  }

  function spawn(){
    var t=Math.random()<0.5?0:1, d=FORKS[t];
    obs.push({x:W+20,w:d.w,h:d.h,t:t});
    if(Math.random()<0.15){ var t2=1-t, d2=FORKS[t2]; obs.push({x:W+20+d.w+14,w:d2.w,h:d2.h,t:t2}); }
  }

  function update(){
    frame++;
    speed=Math.min(11,5+dist/2500);
    dist+=speed;
    p.vy+=0.62; p.y+=p.vy;
    if(p.y>=GY-p.h){ p.y=GY-p.h; p.vy=0; p.jumps=0; }
    nextGap-=speed;
    if(nextGap<=0){ spawn(); nextGap=230+Math.random()*190+speed*14; }
    for(var i=obs.length-1;i>=0;i--){
      var o=obs[i]; o.x-=speed;
      if(o.x+o.w<-10){ obs.splice(i,1); continue; }
      var ox=o.x+o.w*0.12, ow=o.w*0.76, oy=GY-o.h*0.85;
      if(p.x+p.w-8>ox && p.x+8<ox+ow && p.y+p.h-4>oy){ end(); return; }
    }
    scoreEl.textContent=Math.floor(dist/10);
  }

  function hills(off,base,amp,len,color){
    ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,GY);
    for(var x=0;x<=W;x+=10){ ctx.lineTo(x, base-Math.abs(Math.sin((x+off)/len))*amp); }
    ctx.lineTo(W,GY); ctx.closePath(); ctx.fill();
  }

  function draw(){
    if(bgimg.complete&&bgimg.naturalWidth){ ctx.drawImage(bgimg,0,0,W,H); } else { ctx.fillStyle=col.sky; ctx.fillRect(0,0,W,H); }
    ctx.fillStyle='rgba(15,10,25,.25)'; ctx.fillRect(0,0,W,GY);
    ctx.fillStyle='rgba(20,15,30,.55)'; ctx.fillRect(0,GY,W,H-GY);
    ctx.fillStyle='#f2c230';
    for(var x=-(dist%70);x<W;x+=70){ ctx.fillRect(x,GY+24,34,5); }
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(0,GY,W,2);
    obs.forEach(function(o){
      var d=FORKS[o.t];
      if(d.img.complete&&d.img.naturalWidth){ ctx.drawImage(d.img,o.x,GY-o.h+4,o.w,o.h); }
      else { ctx.fillStyle=col.spike; ctx.fillRect(o.x,GY-o.h,o.w,o.h); }
    });
    // personaje: se inclina al saltar
    ctx.save();
    ctx.translate(p.x+p.w/2,p.y+p.h/2);
    ctx.rotate(Math.max(-0.35,Math.min(0.35,p.vy*0.03)));
    if(hero.complete&&hero.naturalWidth){ ctx.drawImage(hero,-p.w/2,-p.h/2,p.w,p.h); }
    else { ctx.fillStyle=col.hero; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); }
    ctx.restore();
  }

  function loop(){
    if(state==='running'){ update(); }
    draw();
    if(state==='running'){ raf=requestAnimationFrame(loop); }
  }
  draw();

  function press(e){
    if(state==='running'){ jump(); }
  }
  document.getElementById('stage').addEventListener('pointerdown',function(e){
    if(e.target===goBtn) return;
    press();
  });
  goBtn.addEventListener('click',start);
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.code==='ArrowUp'){
      if(e.target===goBtn) return;
      e.preventDefault();
      if(state==='running'){ jump(); } else { start(); }
    }
  });
})();
